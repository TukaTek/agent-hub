# See ../../self-host-kubernetes.md before applying.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cortexai-agent-hub-computers
  labels:
    cortexai-agent-hub.example/phase: foundation
  namespace: cortexai-agent-hub-sandboxes
spec:
  hard:
    pods: "2"
    limits.cpu: "4"
    limits.memory: 8Gi
    requests.ephemeral-storage: 4Gi
    limits.ephemeral-storage: 16Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cortexai-agent-hub-computers
  labels:
    cortexai-agent-hub.example/phase: foundation
  namespace: cortexai-agent-hub-sandboxes
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 8Gi
      defaultRequest:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 2Gi
