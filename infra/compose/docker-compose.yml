services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cortexai-agent-hub
      POSTGRES_PASSWORD: cortexai-agent-hub
      POSTGRES_DB: cortexai-agent-hub
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortexai-agent-hub"]
      interval: 3s
      timeout: 5s
      retries: 20

  supervisor:
    build:
      context: ../..
      dockerfile: infra/sandboxes/supervisor/Dockerfile
    environment:
      DATA_DIR: /data
      SUPERVISOR_HOST: "0.0.0.0"
      SUPERVISOR_PORT: "7091"
      DOCKER_SOCKET: /var/run/docker.sock
      CORTEXAI_AGENT_HUB_COMPUTER_IMAGE: cortexai-agent-hub/computer:local
      SANDBOX_COMMAND_TIMEOUT_MS: ${SANDBOX_COMMAND_TIMEOUT_MS:-300000}
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN:?Set SANDBOX_SUPERVISOR_TOKEN in .env}
      SANDBOX_SCREEN_NETWORK: isolated
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../data:/data
    depends_on:
      computer:
        condition: service_completed_successfully

  computer:
    image: cortexai-agent-hub/computer:local
    build:
      context: ../sandboxes/computer
    command: ["true"]
    restart: "no"

  data-init:
    image: busybox:1
    command: ["chown", "-R", "1000:1000", "/data"]
    restart: "no"
    volumes:
      - ../../data:/data

  api:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    command: ["bash", "-lc", "pnpm --filter @cortexai-agent-hub/db exec prisma migrate deploy && pnpm --filter @cortexai-agent-hub/api start"]
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://cortexai-agent-hub:cortexai-agent-hub@postgres:5432/cortexai-agent-hub
      API_HOST: "0.0.0.0"
      DATA_DIR: /data
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      WAKEUP_DRIVER: graphile
      SANDBOX_PROVIDER: docker
      AGENT_RUNTIME: pi
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ../../data:/data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    command: ["pnpm", "--filter", "@cortexai-agent-hub/worker", "start"]
    env_file:
      - ../../.env
    environment:
      BETTER_AUTH_SECRET: ""
      DATABASE_URL: postgres://cortexai-agent-hub:cortexai-agent-hub@postgres:5432/cortexai-agent-hub
      DATA_DIR: /data
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      WAKEUP_DRIVER: graphile
      SANDBOX_PROVIDER: docker
      SCREEN_PROXY_SECRET: ""
      AGENT_RUNTIME: pi
    volumes:
      - ../../data:/data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    command: ["pnpm", "--filter", "@cortexai-agent-hub/web", "preview", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      API_PROXY_TARGET: http://api:3100
      SCREEN_PROXY_SECRET: ${SCREEN_PROXY_SECRET:?Set SCREEN_PROXY_SECRET in .env}
      CORTEXAI_AGENT_HUB_HOST: ${CORTEXAI_AGENT_HUB_HOST:-localhost}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
