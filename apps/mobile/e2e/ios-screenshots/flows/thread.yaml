appId: com.tukatek.cortexai.agenthub
name: Thread
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      CORTEXAI_AGENT_HUB_ACTIVE_EMAIL: ${CORTEXAI_AGENT_HUB_SCREENSHOT_EMAIL}
- openLink: "cortexai-agent-hub:///thread?botId=${CORTEXAI_AGENT_HUB_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*The fixture workspace is ready.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-thread
- scrollUntilVisible:
    element: ".*launch-notes.txt.*"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 40
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-attachment
- openLink: "cortexai-agent-hub:///group-thread?groupId=${CORTEXAI_AGENT_HUB_SCREENSHOT_GROUP_ID}&name=Launch%20team"
- extendedWaitUntil:
    visible: ".*The fixture launch plan is ready.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-group-thread
- openLink: "cortexai-agent-hub:///thread?botId=${CORTEXAI_AGENT_HUB_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*The fixture workspace is ready.*"
    timeout: 20000
- longPressOn:
    text: ".*The fixture workspace is ready.*"
- extendedWaitUntil:
    visible: ".*Reply.*"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: ".*Reply.*"
    commands:
      - assertVisible: ".*Copy.*"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: 04-message-actions
      - tapOn: "Copy"
- openLink: "cortexai-agent-hub:///thread?botId=${CORTEXAI_AGENT_HUB_SCREENSHOT_BOT_ID}&name=Researcher"
- scrollUntilVisible:
    element: ".*launch-notes.txt.*"
    direction: DOWN
    timeout: 15000
- tapOn: ".*launch-notes.txt.*"
- extendedWaitUntil:
    visible: ".*Collect three customer quotes.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-attachment-preview
# The catalog's offline billing has invites on, so the Pro account always sees the gift.
- openLink: "cortexai-agent-hub:///thread?botId=${CORTEXAI_AGENT_HUB_SCREENSHOT_BOT_ID}&name=Researcher"
- tapOn: "Invite a friend"
- extendedWaitUntil:
    visible: ".*2 weeks free.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-invite
