appId: com.tukatek.cortexai.agenthub
name: Compose
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      CORTEXAI_AGENT_HUB_ACTIVE_EMAIL: ${CORTEXAI_AGENT_HUB_SCREENSHOT_EMAIL}
- openLink: "cortexai-agent-hub:///new"
- extendedWaitUntil:
    visible: "Name this bot"
    timeout: 15000
- takeScreenshot: 01-new-bot
- tapOn: "Cancel"
- openLink: "cortexai-agent-hub:///new-space"
- extendedWaitUntil:
    visible: "Customer support|Create space"
    timeout: 15000
- takeScreenshot: 02-new-space
- tapOn: "Cancel"
- openLink: "cortexai-agent-hub:///new-group"
- extendedWaitUntil:
    visible: "Name this group"
    timeout: 15000
- takeScreenshot: 03-new-group
- openLink: "cortexai-agent-hub:///"
