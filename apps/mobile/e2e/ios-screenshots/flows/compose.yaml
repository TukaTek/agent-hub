appId: com.tukatek.cortexai.agenthub
name: Compose
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      CORTEXAI_AGENT_HUB_ACTIVE_EMAIL: ${CORTEXAI_AGENT_HUB_SCREENSHOT_EMAIL}
- openLink: "cortexai-agent-hub:///new-space"
- extendedWaitUntil:
    visible: "Customer support|Create space"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-new-space
- tapOn: "Cancel"
- openLink: "cortexai-agent-hub:///new-bot"
- extendedWaitUntil:
    visible: "Name your Bot"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02b-new-bot
- tapOn: "Cancel"
- openLink: "cortexai-agent-hub:///new-group"
- extendedWaitUntil:
    visible: "Search bots"
    timeout: 15000
- tapOn: "Researcher"
- tapOn: "Writer"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-new-group
- tapOn: "Next"
- assertVisible: "Skip"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-new-group-name
- openLink: "cortexai-agent-hub:///"
