appId: com.tukatek.cortexai.agenthub
name: Files
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      CORTEXAI_AGENT_HUB_ACTIVE_EMAIL: ${CORTEXAI_AGENT_HUB_SCREENSHOT_EMAIL}
- openLink: "cortexai-agent-hub:///artifact?artifactId=${CORTEXAI_AGENT_HUB_SCREENSHOT_ARTIFACT_ID}"
- extendedWaitUntil:
    visible: ".*Collect three customer quotes.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-text
- openLink: "cortexai-agent-hub:///artifact?artifactId=${CORTEXAI_AGENT_HUB_SCREENSHOT_MARKDOWN_ID}"
- extendedWaitUntil:
    visible: ".*Collect customer quotes.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-markdown
- openLink: "cortexai-agent-hub:///artifact?artifactId=${CORTEXAI_AGENT_HUB_SCREENSHOT_PDF_ID}"
- extendedWaitUntil:
    visible: ".*launch-brief.pdf.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-pdf
- openLink: "cortexai-agent-hub:///artifact?artifactId=${CORTEXAI_AGENT_HUB_SCREENSHOT_ARCHIVE_ID}"
- extendedWaitUntil:
    visible: ".*No preview.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-no-preview
- openLink: "cortexai-agent-hub:///image?artifactId=${CORTEXAI_AGENT_HUB_SCREENSHOT_IMAGE_ID}&name=launch-chart.png&mimeType=image%2Fpng&botId=${CORTEXAI_AGENT_HUB_SCREENSHOT_BOT_ID}"
- extendedWaitUntil:
    visible: ".*launch-chart.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-image
- openLink: "cortexai-agent-hub:///artifact?artifactId=${CORTEXAI_AGENT_HUB_SCREENSHOT_VIDEO_ID}"
- extendedWaitUntil:
    visible: ".*launch-demo.mp4.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 06-video
