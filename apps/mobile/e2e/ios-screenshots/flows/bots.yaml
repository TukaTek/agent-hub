appId: com.tukatek.cortexai.agenthub
name: Bots
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      CORTEXAI_AGENT_HUB_ACTIVE_EMAIL: ${CORTEXAI_AGENT_HUB_SCREENSHOT_EMAIL}
- openLink: "cortexai-agent-hub:///bot-profile?botId=${CORTEXAI_AGENT_HUB_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*Routines.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-bot-profile
- tapOn: ".*Routines.*"
- extendedWaitUntil:
    visible: ".*Weekly fixture review.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-routines
- openLink: "cortexai-agent-hub:///bot-model?botId=${CORTEXAI_AGENT_HUB_SCREENSHOT_BOT_ID}"
- extendedWaitUntil:
    visible: ".*Space default.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-bot-model
- openLink: "cortexai-agent-hub:///peer-chat?botId=${CORTEXAI_AGENT_HUB_SCREENSHOT_BOT_ID}&botName=Researcher&peerBotId=${CORTEXAI_AGENT_HUB_SCREENSHOT_PEER_BOT_ID}&peerBotName=Writer"
- extendedWaitUntil:
    visible: ".*draft the announcement.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-peer-chat
- openLink: "cortexai-agent-hub:///routine?botId=${CORTEXAI_AGENT_HUB_SCREENSHOT_BOT_ID}&botName=Researcher"
- extendedWaitUntil:
    visible: "Add schedule"
    timeout: 15000
- tapOn: "Add schedule"
- extendedWaitUntil:
    visible: ".*How often.*"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-new-routine
