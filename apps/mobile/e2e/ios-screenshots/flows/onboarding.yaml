appId: com.tukatek.cortexai.agenthub
name: Onboarding
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      CORTEXAI_AGENT_HUB_ACTIVE_EMAIL: ${CORTEXAI_AGENT_HUB_SCREENSHOT_EMPTY_EMAIL}
- extendedWaitUntil:
    visible: "Personal|Tap \\+ to create a bot"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-empty-inbox
- openLink: "cortexai-agent-hub:///artifacts"
- extendedWaitUntil:
    visible: "No artifacts yet|Artifacts"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-empty-artifacts
- openLink: "cortexai-agent-hub:///"
- extendedWaitUntil:
    visible: "Create"
    timeout: 15000
- tapOn: "Create"
- tapOn: "New bot"
- extendedWaitUntil:
    visible: "What do you want me on first\\?"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-choice-card
- tapOn: "Day-to-day work"
- extendedWaitUntil:
    notVisible: "Inbox & email"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-choice-selected
