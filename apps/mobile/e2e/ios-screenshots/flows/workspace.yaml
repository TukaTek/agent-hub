appId: com.tukatek.cortexai.agenthub
name: Workspace
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      CORTEXAI_AGENT_HUB_ACTIVE_EMAIL: ${CORTEXAI_AGENT_HUB_SCREENSHOT_EMAIL}
- openLink: "cortexai-agent-hub:///board"
- extendedWaitUntil:
    visible: ".*Draft the launch announcement.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-board
- openLink: "cortexai-agent-hub:///approvals"
- extendedWaitUntil:
    visible: ".*example.com.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-approval-rules
- openLink: "cortexai-agent-hub:///vault"
- extendedWaitUntil:
    visible: ".*deploy_token.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-vault
- tapOn: "Help desk"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-vault-item
- tapOn: "Remove"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-vault-remove
- tapOn: "Cancel"
- tapOn: "Done"
- tapOn: "New item"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-vault-new
- tapOn: "Card"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 07-vault-new-card
- tapOn: "Cancel"
- openLink: "cortexai-agent-hub:///archived-bots"
- extendedWaitUntil:
    visible: ".*Archived fixture.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08-archived-bots
- openLink: "cortexai-agent-hub:///space?spaceId=${CORTEXAI_AGENT_HUB_SCREENSHOT_TEAM_SPACE_ID}"
- extendedWaitUntil:
    visible: ".*Customize.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 09-space-settings
