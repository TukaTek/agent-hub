appId: com.tukatek.cortexai.agenthub
name: Request cards
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      CORTEXAI_AGENT_HUB_ACTIVE_EMAIL: ${CORTEXAI_AGENT_HUB_SCREENSHOT_EMAIL}
- openLink: "cortexai-agent-hub:///thread?botId=${CORTEXAI_AGENT_HUB_SCREENSHOT_CARDS_BOT_ID}&name=Support"
- extendedWaitUntil:
    visible: ".*api.example.test.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-api-key
- scrollUntilVisible:
    element: ".*Pay on freshcart.test.*"
    direction: UP
    timeout: 15000
    visibilityPercentage: 100
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-pay
- scrollUntilVisible:
    element: ".*Which tone should replies use.*"
    direction: UP
    timeout: 15000
    visibilityPercentage: 100
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-choice-and-computer
- scrollUntilVisible:
    element: ".*Sign in to the help desk.*"
    direction: UP
    timeout: 15000
    visibilityPercentage: 100
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-answered-requests
- scrollUntilVisible:
    element: ".*Gmail.*"
    direction: UP
    timeout: 15000
    visibilityPercentage: 100
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-app-connect
