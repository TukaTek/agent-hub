appId: com.tukatek.cortexai.agenthub
name: Models
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      CORTEXAI_AGENT_HUB_ACTIVE_EMAIL: ${CORTEXAI_AGENT_HUB_SCREENSHOT_EMAIL}
- openLink: "cortexai-agent-hub:///models"
- extendedWaitUntil:
    visible: ".*Claude Fable 5.1.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-models
- tapOn: ".*Claude Fable 5.1.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-model-picker
- openLink: "cortexai-agent-hub:///models"
- extendedWaitUntil:
    visible: "Add provider"
    timeout: 15000
- tapOn: "Add provider"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-add-provider
- tapOn: ".*OpenRouter.*"
- extendedWaitUntil:
    visible: "API key"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-model-connection
