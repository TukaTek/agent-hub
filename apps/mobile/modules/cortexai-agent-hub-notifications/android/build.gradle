plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.tukatek.cortexai.agenthub.notifications'
version = '0.1.0'

android {
  namespace 'com.tukatek.cortexai.agenthub.notifications'
  defaultConfig {
    versionName '0.1.0'
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  // The real parser: Android's own org.json is a stub in local unit tests.
  testImplementation 'org.json:json:20240303'
}
