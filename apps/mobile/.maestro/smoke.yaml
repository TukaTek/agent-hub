appId: com.tukatek.cortexai.agenthub
name: CortexAI Agent Hub mobile smoke
---
- launchApp:
    clearState: true

- assertVisible: "Sign up for CortexAI Agent Hub"
- assertVisible: "Name"
- tapOn: "Sign in"
- runFlow:
    when:
      true: ${typeof CORTEXAI_AGENT_HUB_MOBILE_API_URL !== "undefined" && CORTEXAI_AGENT_HUB_MOBILE_API_URL != null && CORTEXAI_AGENT_HUB_MOBILE_API_URL.trim() !== ""}
    file: helpers/server.yaml
- assertVisible: "Sign in to CortexAI Agent Hub"
- tapOn: "Email"
- inputText: ${CORTEXAI_AGENT_HUB_E2E_EMAIL}
- tapOn:
    text: "Use password"
    optional: true
- tapOn: "Password"
- inputText: ${CORTEXAI_AGENT_HUB_E2E_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"

- extendedWaitUntil:
    visible: "New bot"
    timeout: 30000
- tapOn: "New bot"
- assertVisible: "Name this bot"
- tapOn: "Name this bot"
- inputText: ${CORTEXAI_AGENT_HUB_E2E_BOT_NAME}
- hideKeyboard
- tapOn: "Create"

- extendedWaitUntil:
    visible: "Message…"
    timeout: 30000
- tapOn: "Message…"
- inputText: ${CORTEXAI_AGENT_HUB_E2E_MESSAGE}
- pressKey: Enter
- assertVisible: ${CORTEXAI_AGENT_HUB_E2E_MESSAGE}

- tapOn: "Bot actions"
- tapOn: "Open computer"
- extendedWaitUntil:
    visible: "Open computer"
    timeout: 30000
- tapOn: "Open computer"
- extendedWaitUntil:
    visible: "You have control"
    timeout: 90000
- tapOn: "Close computer"
- tapOn: "Release"
- extendedWaitUntil:
    visible: "Take control"
    timeout: 30000
