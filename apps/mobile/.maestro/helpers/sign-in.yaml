appId: com.tukatek.cortexai.agenthub
---
# A cold API 34 emulator can show a launcher ANR over the healthy app, and a relaunch
# after clearState can take Maestro about half a minute to bring the app back.
- extendedWaitUntil:
    visible: "Sign up for CortexAI Agent Hub|Pixel Launcher isn't responding"
    timeout: 60000
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"
- extendedWaitUntil:
    visible: "Sign up for CortexAI Agent Hub"
    timeout: 30000
- tapOn: "Sign in"
- runFlow: server.yaml
- tapOn: "Email"
- inputText: ${CORTEXAI_AGENT_HUB_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: ${CORTEXAI_AGENT_HUB_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
