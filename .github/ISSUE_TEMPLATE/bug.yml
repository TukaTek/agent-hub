name: Bug report
description: Something is broken in CortexAI Agent Hub
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        For **security vulnerabilities**, use [private vulnerability reporting](https://github.com/TukaTek/agent-hub/security/advisories/new) — do not use this form. See [SECURITY.md](https://github.com/TukaTek/agent-hub/blob/main/SECURITY.md).

  - type: checkboxes
    id: not-security
    attributes:
      label: Confirmation
      options:
        - label: This is not a security vulnerability report
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong? Keep it concise.
      placeholder: The assistant computer pane stays blank after sending a message.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps from a clean local setup when possible.
      placeholder: |
        1. `pnpm dev`
        2. Create an assistant and send "hello"
        3. Open the computer pane
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CortexAI Agent Hub version or commit
      placeholder: v0.1.0 or abc1234
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: sandbox
    attributes:
      label: SANDBOX_PROVIDER
      description: If relevant (default is `docker`).
      placeholder: docker

  - type: input
    id: runtime
    attributes:
      label: AGENT_RUNTIME
      description: If relevant (default is `pi`).
      placeholder: pi

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact secrets and tokens. Use placeholders instead of real keys.
      render: shell
